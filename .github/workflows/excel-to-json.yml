name: DZIF Master - Excel zu JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - DZIF_Intelligence_Master.xlsx
      - scripts/export_master.py
      - .github/workflows/excel-to-json.yml

permissions:
  contents: write

concurrency:
  group: dzif-master-convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v7
      - name: Python vorbereiten
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Excel-Bibliothek installieren
        run: python -m pip install openpyxl==3.1.5
      - name: Excel pruefen und JSON erzeugen
        id: convert
        run: python scripts/export_master.py
      - name: Pruefbericht fuer Fehlerdiagnose bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DZIF_Master_Pruefbericht
          path: DZIF_Master_Validation_Report.json
          if-no-files-found: warn
      - name: Validierte Ergebnisse oder Fehlerstatus speichern
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DZIF_Master_Status.json DZIF_Master_Validation_Report.json
          if [ -f DZIF_Intelligence_Master.json ]; then
            git add DZIF_Intelligence_Master.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Generate validated DZIF Master JSON [skip ci]'
            git push
          else
            echo 'Keine neuen Daten.'
          fi
